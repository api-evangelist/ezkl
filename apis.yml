name: EZKL
description: >-
  EZKL (by Zkonduit Inc.) is a developer-friendly engine for verifiable AI and
  analytics that generates zero-knowledge proofs (ZK-SNARKs, Halo2) for machine
  learning model inference. Given a model in ONNX format and sample input, EZKL
  automatically compiles a proving circuit and produces a cryptographic proof
  that a computation ran correctly without revealing the underlying private data
  or model weights. Proofs are verifiable on-chain (EVM-compatible), in the
  browser, or on edge devices. EZKL ships as a command-line tool, Python and
  JavaScript (WebAssembly) bindings, and a Rust library, and supports tree-based
  models, transformers, CNNs, and RNNs. Lilith is its high-performance compute
  cluster for cloud-scale proof generation. The codebase was audited by Trail of
  Bits and is developed in the open at github.com/zkonduit/ezkl.
